name: Build & Deploy - development

on:
  repository_dispatch:
    types: [deploy-development]
  push:
    branches:
      - develop 

jobs:
  workflow:
    uses: brianmonteiro54/devops-template/.github/workflows/bundle.yml@main


    with:
      IMAGE_NAME: api-development
      TASK_NAME: api-development
      CONTAINER_NAME: api-development
      ECS_SERVICE: api-development
      ECS_CLUSTER: development
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}