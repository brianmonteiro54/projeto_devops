name: "Terraform Infrastructure Provisioning - Development"

on:
  push:
    branches:
      - develop
  repository_dispatch:
    types: [deploy-development]

permissions:
  id-token: write
  contents: read

jobs:
  terraform_dev:
    name: "Terraform DEV"
    uses: brianmonteiro54/devops-template/.github/workflows/terraform.yml@v1.5
    with:
      environment: dev
      aws-statefile-s3-bucket: "brian-terraform"
    secrets:
      AWS_ASSUME_ROLE_ARN: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

  deploy_app_dev:
    name: "Deploy Application DEV"
    needs: terraform_dev # Garante que este trabalho seja executado somente após o sucesso do terraform_dev
    if: needs.terraform_dev.result == 'success' && needs.terraform_dev.outputs.destroy_active == 'false'
    uses: brianmonteiro54/devops-template/.github/workflows/bundle.yml@v1.5
    with:
      IMAGE_NAME: api-development
      TASK_NAME: api-development
      CONTAINER_NAME: api-development
      ECS_SERVICE: api-development
      ECS_CLUSTER: development
    secrets:
      AWS_ASSUME_ROLE_ARN: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}