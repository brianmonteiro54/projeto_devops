name: "DEV DEPLOY"

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      aws-assume-role-arn: "arn:aws:iam::170672024221:role/role-github"
      aws-region: "us-east-1"
      aws-statefile-s3-bucket: "brian-terraform"